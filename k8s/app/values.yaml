catalog:
  mysql:
    create: false
    endpoint: "project-bedrock-cluster-mysql.cql4mmi28egn.us-east-1.rds.amazonaws.com"
    database: catalog
    secret:
      create: false
      name: catalog-db-secret
      username: username
      password: password

orders:
  postgresql:
    create: false
    database: orders
    endpoint:
      host: "project-bedrock-cluster-postgres.cql4mmi28egn.us-east-1.rds.amazonaws.com"
      port: "5432"
    secret:
      create: false
      name: orders-db-secret
      username: username
      password: password
  rabbitmq:
    create: true

carts:
  persistence: dynamodb
  dynamodb:
    create: false
    tableName: retail-store-carts

checkout:
  endpoints:
    orders: http://retail-store-orders:80
  redis:
    create: true
    address: retail-store-checkout-redis
    port: 6379

ui:
  endpoints:
    catalog: http://retail-store-catalog:80
    carts: http://retail-store-carts:80
    checkout: http://retail-store-checkout:80
    orders: http://retail-store-orders:80
    assets: http://retail-store-assets:80
